name: GLF kernel and signed boot
on:
  schedule:
    - cron: '23 5 * * *'
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: secureboot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  current-unavailable:
    runs-on: ubuntu-24.04
    steps:
      - name: Signaler current indisponible
        run: |
          echo "::warning::Canal current indisponible : rebuildImage absent. Aucune construction, signature ou publication current."
          echo "### Current : indisponible" >> "$GITHUB_STEP_SUMMARY"
          echo "Exception temporaire autorisee : seule la reussite de testing conditionne la fusion. Aucun artefact current n'est publie." >> "$GITHUB_STEP_SUMMARY"
  testing:
    # Le workflow appele restreint ce droit au seul job de publication.
    permissions:
      contents: write
    uses: ./.github/workflows/channel.yml
    with:
      profile: testing
    secrets: inherit
  validate:
    if: always()
    needs: testing
    runs-on: ubuntu-24.04
    steps:
      - name: Verifier le canal testing obligatoire
        env:
          RESULT: ${{ needs.testing.result }}
        run: test "$RESULT" = success
