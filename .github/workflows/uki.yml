name: GLF kernel and signed boot
on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: secureboot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  channels:
    strategy:
      fail-fast: false
      matrix:
        profile: [current, testing]
    # Le workflow appele restreint ce droit au seul job de publication.
    permissions:
      contents: write
    uses: ./.github/workflows/channel.yml
    with:
      profile: ${{ matrix.profile }}
    secrets: inherit
  validate:
    if: always()
    needs: channels
    runs-on: ubuntu-24.04
    steps:
      - name: Verifier les deux canaux
        env:
          RESULT: ${{ needs.channels.result }}
        run: test "$RESULT" = success
