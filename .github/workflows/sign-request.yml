name: Sign Secure Boot images
run-name: ${{ inputs.request_tag }}
on:
  workflow_dispatch:
    inputs:
      request_tag:
        description: Draft release contenant les images du poste
        type: string
        required: true
      request_sha256:
        description: SHA256 du manifeste request.json
        type: string
        required: true
permissions:
  contents: read
jobs:
  validate:
    if: >-
      github.ref_type == 'branch' && github.ref_protected &&
      vars.GLF_SIGNING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012
      - name: Construire les composants approuves et valider la demande sans cle
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_TAG: ${{ inputs.request_tag }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
        run: nix develop --no-update-lock-file .#ci --command bash ci/prepare-request.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/unsigned/
          retention-days: 1
          if-no-files-found: error
  sign:
    needs: validate
    environment: glf-signing-production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012
      - uses: actions/download-artifact@v4
        with:
          name: validated-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/unsigned/
      - name: Preparer les outils et verifier le manifeste sans secrets
        env:
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
        run: |
          nix print-dev-env --no-update-lock-file .#ci > /tmp/glf-sign-tools.sh
          source /tmp/glf-sign-tools.sh
          export PYTHONPATH="$PWD/pkgs/boot-tools/src"
          python3 -c 'import os; from signing_protocol import validate; validate("dist/unsigned", os.environ["REQUEST_SHA256"])'
      - name: Signer les images validees avec la cle persistante
        env:
          GLF_SIGNING_KEY_PEM: ${{ secrets.GLF_SIGNING_KEY_PEM }}
          GLF_SIGNING_CERT_PEM: ${{ secrets.GLF_SIGNING_CERT_PEM }}
          GLF_CERT_SHA256: ${{ vars.GLF_CERT_SHA256 }}
        run: |
          source /tmp/glf-sign-tools.sh
          bash ci/sign.sh
          cp dist/unsigned/request.json dist/signed/request.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.request_tag }}
          path: dist/signed/
          retention-days: 7
          if-no-files-found: error
